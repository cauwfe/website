<script>
(() => {
  'use strict';
 
  /* ---------- theme ---------- */
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const ICON_SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M13.5 9.6A5.7 5.7 0 0 1 6.4 2.5a5.7 5.7 0 1 0 7.1 7.1z"/></svg>';
  let theme = 'light';                 // always opens in light mode; the toggle only lasts for the visit
  function applyTheme() {
    root.dataset.theme = theme;
    themeBtn.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = theme === 'dark' ? '#1a1917' : '#ebe7dd';
  }
  themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  });
  applyTheme();
 
  /* ---------- palettes (rgb) ---------- */
  const PAL = {
    dark: {
      // sampled from the daoho.dev screenshot, with a clean white instead of its grey
      white: [238, 232, 220], orange: [172, 97, 52], red: [158, 74, 40],
      amber: [184, 118, 64], black: [42, 42, 49],
      shadow: [255, 244, 220, 0.007], ripple: [150, 147, 141], pellet: [184, 118, 64]
    },
    light: {
      white: [255, 252, 242], orange: [226, 112, 40], red: [196, 58, 32],
      amber: [236, 150, 70], black: [52, 52, 60],
      shadow: [90, 70, 40, 0.014], ripple: [90, 84, 74], pellet: [214, 100, 30]
    }
  };
 
  /* ---------- canvas ---------- */
  const cv = document.getElementById('pond');
  const ctx = cv.getContext('2d');
  const nFishEl = document.getElementById('nFish');
  const nFedEl = document.getElementById('nFed');
  const FONT = 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace';
  let W = 0, H = 0, dpr = 1, CS = 14, cols = 0, rows = 0;
 
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    CS = W < 600 ? 11 : 14;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / CS); rows = Math.ceil(H / CS);
  }
  window.addEventListener('resize', resize);
  resize();
 
  /* ---------- helpers ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const BODY_CHARS = { white: '8S%X', orange: '8X%S', red: '8X%', amber: '%X8', black: 'X8' };
 
  /* ---------- koi ---------- */
  function makeSpots() {
    // kohaku-style: a white koi with a few big, soft-edged saddles of orange/red
    const spots = [];
    const style = Math.random();
    const n = style < 0.2 ? 2 : Math.floor(rnd(3, 5));       // a few mostly-white koi, most with several patches
    let u = rnd(0.1, 0.22);
    for (let i = 0; i < n && u < 0.88; i++) {
      const r = Math.random();
      const col = r < 0.6 ? 'orange' : r < 0.85 ? 'red' : 'amber';
      const ru = rnd(0.09, 0.17), v = rnd(-0.35, 0.35), rv = rnd(0.7, 1.15);
      spots.push({ u, v, ru, rv, col });
      // overlapping lobe + a small "heart" of deeper red so patches feel organic
      spots.push({ u: u + rnd(-0.07, 0.07), v: v + rnd(-0.4, 0.4), ru: ru * rnd(0.6, 0.9), rv: rv * rnd(0.5, 0.8), col });
      if (col === 'orange' && Math.random() < 0.4)
        spots.push({ u: u + rnd(-0.03, 0.03), v: v + rnd(-0.2, 0.2), ru: ru * 0.4, rv: rv * 0.4, col: 'red' });
      u += ru * rnd(1.8, 2.8);                                  // march down the back so patches don't all pile up
    }
    // tancho-style red crown on some fish
    if (Math.random() < 0.45) spots.push({ u: 0.04, v: 0, ru: 0.09, rv: 0.9, col: 'red' });
    return spots;
  }
 
  function makeFish(x, y) {
    const N = Math.floor(rnd(20, 26));            // long, slim body
    const ang = rnd(0, Math.PI * 2);
    const f = {
      N, w: rnd(2.6, 3.2), ang, speed: rnd(2.5, 4), base: rnd(2.4, 3.6),
      phase: rnd(0, 6.28), spots: makeSpots(), pts: [], tx: 0, ty: 0, boost: 0,
      depth: rnd(0.78, 1),                         // deeper koi are a little fainter and slower
      restT: rnd(3, 12), restLen: rnd(2, 3.5), wake: rnd(0.3, 1.5)
    };
    for (let i = 0; i < N; i++) f.pts.push({ x: x - Math.cos(ang) * i * 1.0, y: y - Math.sin(ang) * i * 1.0 });
    pickTarget(f);
    return f;
  }
  function pickTarget(f) {
    f.tx = rnd(-3, cols + 3); f.ty = rnd(-3, rows + 3);
  }
 
  const fish = [];
  const ripples = [];
  const pellets = [];
  let fed = 0;
  const FISH_COUNT = 6;
  for (let i = 0; i < FISH_COUNT; i++) fish.push(makeFish(rnd(0, cols), rnd(0, rows * 0.7)));
  nFishEl.textContent = FISH_COUNT;
 
  function addRipple(x, y, max, strength) {
    ripples.push({ x, y, t: 0, dur: max * 0.42 + 1.2, max, s: strength });
  }
 
  function updateFish(f, dt) {
    const head = f.pts[0];
 
    // choose a target: nearest pellet if any, else wander
    let chasing = false;
    let best = null, bd = 1e9;
    for (const p of pellets) {
      if (p.age < 0.35) continue;
      const d = Math.hypot(p.x - head.x, p.y - head.y);
      if (d < bd && d < 60) { bd = d; best = p; }
    }
    if (best) { f.tx = best.x; f.ty = best.y; chasing = true; }
    else if (Math.hypot(f.tx - head.x, f.ty - head.y) < 4) pickTarget(f);
 
    // steer
    // steer around other koi's bodies (only when close, so they can still swim right up to each other)
    let ax = 0, ay = 0;
    for (const o of fish) {
      if (o === f) continue;
      const lim = (f.w + o.w) * 0.9 + 5;
      for (let k = 0; k < o.N; k += 2) {
        const q = o.pts[k], dx = head.x - q.x, dy = head.y - q.y, d = Math.hypot(dx, dy);
        if (d < lim && d > 0.01) { const wg = (lim - d) / lim; ax += dx / d * wg; ay += dy / d * wg; }
      }
    }
    let gx = f.tx - head.x, gy = f.ty - head.y;
    const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
    const want = Math.atan2(gy + ay * 2.5, gx + ax * 2.5);
    const diff = wrap(want - f.ang);
    const maxTurn = (chasing ? 3.2 : 1.5) * dt;
    f.ang += clamp(diff, -maxTurn, maxTurn);
 
    // keep within the (slightly oversized) pond
    const m = 5;
    if (head.x < -m && Math.cos(f.ang) < 0 || head.x > cols + m && Math.cos(f.ang) > 0 ||
        head.y < -m && Math.sin(f.ang) < 0 || head.y > rows + m && Math.sin(f.ang) > 0) {
      f.tx = cols / 2 + rnd(-cols / 4, cols / 4); f.ty = rows / 2 + rnd(-rows / 4, rows / 4);
    }
 
    // now and then a koi stops beating its tail and drifts
    f.restT -= dt;
    if (f.restT < -f.restLen) { f.restT = rnd(6, 15); f.restLen = rnd(1.8, 3.6); }
    const resting = !chasing && f.restT < 0;
    const goal = chasing ? f.base * 2.4 : f.base * f.depth * (resting ? 0.28 : 1);
    f.boost = Math.max(0, f.boost - dt);
    f.speed += (goal + (f.boost > 0 ? 3 : 0) - f.speed) * Math.min(1, dt * 2.5);
    // each tail beat gives a little surge forward, then a glide
    const surge = 0.78 + 0.34 * Math.sin(f.phase - 0.8);
    head.x += Math.cos(f.ang) * f.speed * surge * dt;
    head.y += Math.sin(f.ang) * f.speed * surge * dt;
    f.phase += dt * (resting ? 1.6 : 3 + f.speed * 0.9);
    // tiny wake ripples while swimming
    f.wake -= dt;
    if (f.wake <= 0) {
      f.wake = rnd(1, 1.9);
      if (f.speed > 2 && head.x > 0 && head.y > 0 && head.x < cols && head.y < rows) addRipple(head.x, head.y, 3.5, 0.22);
    }
 
    // follow-the-leader spine
    const seg = 1.0;
    for (let i = 1; i < f.N; i++) {
      const a = f.pts[i - 1], b = f.pts[i];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.hypot(dx, dy) || 1e-6;
      if (d > seg) { const k = (d - seg) / d; b.x += dx * k; b.y += dy * k; }
    }
 
    // eat pellets
    for (let i = pellets.length - 1; i >= 0; i--) {
      const p = pellets[i];
      if (p.age > 0.35 && Math.hypot(p.x - head.x, p.y - head.y) < 2.2) {
        pellets.splice(i, 1);
        addRipple(p.x, p.y, 5, 0.9);
        fed++; nFedEl.textContent = fed;
        f.boost = 0.6;
      }
    }
  }
 
  /* hard separation: no two koi may overlap (they can still touch edge-to-edge) */
  function separate() {
    for (let pass = 0; pass < 2; pass++) {
      for (let a = 0; a < fish.length; a++) {
        for (let b = a + 1; b < fish.length; b++) {
          const A = fish[a], B = fish[b];
          for (let i = 0; i < A.N; i++) {
            const ra = radiusAt(i / (A.N - 1), A.w);
            for (let j = 0; j < B.N; j++) {
              const p = A.pts[i], q = B.pts[j];
              const dx = p.x - q.x, dy = p.y - q.y;
              const min = (ra + radiusAt(j / (B.N - 1), B.w)) * 0.92;
              const d2 = dx * dx + dy * dy;
              if (d2 >= min * min) continue;
              const d = Math.sqrt(d2) || 0.01, push = (min - d) * 0.5;
              const nx = dx / d, ny = dy / d;
              p.x += nx * push; p.y += ny * push; q.x -= nx * push; q.y -= ny * push;
            }
          }
        }
      }
    }
  }
 
  /* spine with swim wave -> array of {x,y,tx,ty} */
  function spine(f) {
    const out = [];
    const N = f.N;
    for (let i = 0; i < N; i++) {
      const a = f.pts[Math.max(0, i - 1)], b = f.pts[Math.min(N - 1, i + 1)];
      let tx = a.x - b.x, ty = a.y - b.y;
      const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
      const amp = 0.2 + 0.9 * Math.pow(i / (N - 1), 1.3);
      const off = Math.sin(f.phase - i * 0.55) * amp * 0.9;
      out.push({ x: f.pts[i].x - ty * off, y: f.pts[i].y + tx * off, tx, ty });
    }
    return out;
  }
 
  function radiusAt(u, w) {
    if (u < 0.1) return w * (0.45 + 0.4 * (u / 0.1));                     // rounded snout
    if (u < 0.36) return w * (0.85 + 0.15 * Math.sin((u - 0.1) / 0.26 * Math.PI / 2)); // shoulders, widest point
    if (u < 0.76) return w * (1 - 0.74 * Math.pow((u - 0.36) / 0.4, 1.15)); // taper to the narrow tail base
    return w * 0.26 + w * 0.85 * Math.pow((u - 0.76) / 0.24, 1.1);       // tail fin fans out
  }
 
  function spotColor(f, u, v) {
    for (let i = f.spots.length - 1; i >= 0; i--) {
      const s = f.spots[i];
      const du = (u - s.u) / s.ru, dv = (v - s.v) / s.rv;
      if (du * du + dv * dv < 1) return s.col;
    }
    return 'white';
  }
 
  /* rasterise one fish to cells; pass `cells` array + offset (for shadow) */
  function raster(f, sp, ox, oy, out, shadow) {
    const N = sp.length, STEPS = 3, total = (N - 1) * STEPS;
    const found = new Map();
    for (let k = 0; k <= total; k++) {
      const i = Math.min(N - 2, Math.floor(k / STEPS)), t = (k / STEPS) - i;
      const A = sp[i], B = sp[i + 1];
      const x = A.x + (B.x - A.x) * t + ox, y = A.y + (B.y - A.y) * t + oy;
      const px = -(A.ty + (B.ty - A.ty) * t), py = A.tx + (B.tx - A.tx) * t;
      const u = k / total;
      const r = radiusAt(u, f.w);
      const x0 = Math.floor(x - r - 1), x1 = Math.ceil(x + r + 1);
      const y0 = Math.floor(y - r - 1), y1 = Math.ceil(y + r + 1);
      for (let cy = y0; cy <= y1; cy++) {
        if (cy < 0 || cy >= rows) continue;
        for (let cx = x0; cx <= x1; cx++) {
          if (cx < 0 || cx >= cols) continue;
          const dx = cx + 0.5 - x, dy = cy + 0.5 - y;
          const d = Math.hypot(dx, dy) / r;
          if (d > 1) continue;
          const key = cy * cols + cx;
          const prev = found.get(key);
          if (!prev || d < prev.d) {
            found.set(key, { d, u, v: clamp((dx * px + dy * py) / r, -1, 1), cx, cy });
          }
        }
      }
    }
    for (const c of found.values()) {
      const key = c.cy * cols + c.cx;
      if (shadow) { out[key] = { shadow: true }; continue; }
      // forked tail: carve a notch out of the middle of the fin
      if (c.u > 0.9 && Math.abs(c.v) < (c.u - 0.9) * 7) continue;
      const tail = c.u > 0.8;
      const col = tail && c.u > 0.9 ? 'white' : spotColor(f, c.u, c.v);
      const alpha = (tail ? (theme === 'dark' ? 0.62 : 0.65) : 1) * (c.d > 0.82 ? 0.9 : 1) * f.depth;
      const set = BODY_CHARS[col];
      const ch = set[(c.cx * 7 + c.cy * 13 + Math.floor(T * 0.9 + c.cx * 0.37 + c.cy * 0.21)) % set.length]; // scales slowly shimmer
      out[key] = { col, a: alpha, ch, fin: false };
    }
 
    if (shadow) return;
 
    // pectoral fins: short swept-back paddles that flutter, drawn as pale translucent cells
    const S = sp[Math.floor(N * 0.24)];
    const flap = Math.sin(f.phase * 1.3) * 0.5;
    for (const side of [-1, 1]) {
      for (let j = 0; j < 3; j++) {
        const off = radiusAt(0.24, f.w) + 0.3 + j * 0.85 + flap * 0.35 * (j + 1) / 3;
        const back = 0.4 + j * 1.1;
        const fx = Math.floor(S.x - S.ty * side * off - S.tx * back);
        const fy = Math.floor(S.y + S.tx * side * off - S.ty * back);
        if (fx < 0 || fy < 0 || fx >= cols || fy >= rows) continue;
        const key = fy * cols + fx;
        if (!out[key]) out[key] = { col: 'white', a: 0.5 - j * 0.08, ch: ['%', '/', '.'][j], fin: false };
      }
    }
    // eyes
    const E = sp[1], er = radiusAt(0.06, f.w) * 0.62;
    for (const side of [-1, 1]) {
      const ex = Math.floor(E.x - E.ty * side * er), ey = Math.floor(E.y + E.tx * side * er);
      if (ex < 0 || ey < 0 || ex >= cols || ey >= rows) continue;
      out[ey * cols + ex] = { eye: true, ch: 'o' };
    }
  }
 
  /* ---------- input ---------- */
  const MAX_FOOD = 4, REFILL = 5;     // 4 scoops, one comes back every 5s
  let food = MAX_FOOD, refill = 0;
  const foodEl = document.getElementById('food');
  function drawFood() {
    foodEl.textContent = '[' + '#'.repeat(food) + '.'.repeat(MAX_FOOD - food) + ']';
  }
  drawFood();
  function feed(clientX, clientY) {
    const x = clientX / CS, y = clientY / CS;
    if (food <= 0 || pellets.length > 24) { addRipple(x, y, 4, 0.35); return; }   // pond is full / out of food
    food--; drawFood();
    addRipple(x, y, 8, 1);
    const n = 4;
    for (let i = 0; i < n; i++) pellets.push({ x: x + rnd(-2.5, 2.5), y: y + rnd(-2.5, 2.5), age: 0 });
  }
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('a, button')) return;
    feed(e.clientX, e.clientY);
  });
 
  /* ---------- draw ---------- */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
 
  let last = performance.now();
  let rainT = 2;
  let T = 0;                                   // seconds since load (drives scale shimmer)
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
 
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * (reduce ? 0.5 : 1);
    T += dt;
    last = now;
    const P = PAL[theme];
 
    // update
    for (const f of fish) updateFish(f, dt);
    separate();
    for (let i = pellets.length - 1; i >= 0; i--) { pellets[i].age += dt; if (pellets[i].age > 25) pellets.splice(i, 1); }
    for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > ripples[i].dur) ripples.splice(i, 1); }
    if (food < MAX_FOOD) { refill += dt; if (refill >= REFILL) { refill = 0; food++; drawFood(); } } else refill = 0;
    rainT -= dt;
    if (rainT <= 0) { rainT = rnd(3, 7); addRipple(rnd(0, cols), rnd(0, rows), rnd(5, 9), 0.5); }
 
    // rasterise
    const shadowCells = [], bodyCells = [];
    const spines = fish.map(spine);
    fish.forEach((f, i) => raster(f, spines[i], 3, 3.5, shadowCells, true));
    fish.forEach((f, i) => raster(f, spines[i], 0, 0, bodyCells, false));
 
    // paint
    ctx.clearRect(0, 0, W, H);
    ctx.font = `${Math.round(CS * 0.78)}px ${FONT}`;
 
    // ripples (under fish)
    for (const r of ripples) {
      const k = r.t / r.dur;
      const R = r.max * (1 - Math.pow(1 - k, 2));
      const a = (1 - k) * 0.5 * r.s;
      const pad = Math.ceil(R + 2);
      const cx0 = Math.floor(r.x) - pad, cy0 = Math.floor(r.y) - pad;
      for (let cy = cy0; cy <= cy0 + pad * 2; cy++) {
        if (cy < 0 || cy >= rows) continue;
        for (let cx = cx0; cx <= cx0 + pad * 2; cx++) {
          if (cx < 0 || cx >= cols) continue;
          const dx = cx + 0.5 - r.x, dy = cy + 0.5 - r.y;
          const d = Math.hypot(dx, dy);
          let ch = null, aa = a;
          if (Math.abs(d - R) < 0.85) {
            const t = ((Math.atan2(dy, dx) + Math.PI / 2) % Math.PI + Math.PI) % Math.PI;
            ch = (t < Math.PI / 8 || t > 7 * Math.PI / 8) ? '-' : t < 3 * Math.PI / 8 ? '\\' : t < 5 * Math.PI / 8 ? '|' : '/';
            // note: tangent angle in y-down coordinates
            if (ch === '\\') ch = '/'; else if (ch === '/') ch = '\\';
          } else if (d < R - 1 && d > R - 3.2 && ((cx * 31 + cy * 17) % 5 === 0)) {
            ch = '.'; aa = a * 0.6;
          }
          if (ch) {
            ctx.fillStyle = `rgba(${P.ripple[0]},${P.ripple[1]},${P.ripple[2]},${aa})`;
            ctx.fillText(ch, cx * CS + CS / 2, cy * CS + CS / 2 + 1);
          }
        }
      }
    }
 
    // shadows
    ctx.fillStyle = `rgba(${P.shadow[0]},${P.shadow[1]},${P.shadow[2]},${P.shadow[3]})`;
    for (let i = 0; i < shadowCells.length; i++) {
      if (!shadowCells[i] || bodyCells[i]) continue;
      const cx = i % cols, cy = (i / cols) | 0;
      ctx.fillRect(cx * CS + 1, cy * CS + 1, CS - 2, CS - 2);
    }
 
    // bodies
    for (let i = 0; i < bodyCells.length; i++) {
      const c = bodyCells[i];
      if (!c) continue;
      const cx = i % cols, cy = (i / cols) | 0;
      const x = cx * CS, y = cy * CS;
      if (c.fin) {
        ctx.fillStyle = `rgba(${P.ripple[0]},${P.ripple[1]},${P.ripple[2]},0.45)`;
        ctx.fillText(c.ch, x + CS / 2, y + CS / 2 + 1);
        continue;
      }
      if (c.eye) {                                   // eyes: just the glyph, no box behind it
        ctx.font = `bold ${Math.round(CS * 0.95)}px ${FONT}`;
        ctx.fillStyle = theme === 'dark' ? 'rgba(244,238,226,0.95)' : 'rgba(34,20,10,0.95)';
        ctx.fillText('o', x + CS / 2, y + CS / 2 + 1);
        ctx.font = `${Math.round(CS * 0.78)}px ${FONT}`;
        continue;
      }
      const rgb = P[c.col];
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${c.a})`;
      ctx.fillRect(x + 1, y + 1, CS - 2, CS - 2);
      if (c.col === 'black') ctx.fillStyle = 'rgba(255,255,255,0.18)';
      else ctx.fillStyle = `rgba(0,0,0,${0.26 * c.a})`;
      ctx.fillText(c.ch, x + CS / 2, y + CS / 2 + 1);
    }
 
    // pellets
    for (const p of pellets) {
      const a = p.age < 14 ? 1 : Math.max(0, 1 - (p.age - 14) / 11);
      ctx.fillStyle = `rgba(${P.pellet[0]},${P.pellet[1]},${P.pellet[2]},${a})`;
      const bob = Math.sin(p.age * 2 + p.x) * 0.15;
      ctx.fillText('o', p.x * CS, (p.y + bob) * CS);
    }
 
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
