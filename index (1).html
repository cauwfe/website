<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@cauwfe</title>
  <meta name="description" content="@cauwfe: personal landing page.">
  <meta name="theme-color" content="#191817">
  <meta property="og:title" content="@cauwfe">
  <meta property="og:description" content="@cauwfe: personal landing page.">

  <!-- apply the saved theme before first paint to avoid a flash -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="nav">
    <span class="current" aria-current="page">home</span>
    <button id="theme" type="button" aria-label="Switch between dark and light theme">
      <svg class="icon sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
      <svg class="icon moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
      </svg>
    </button>
  </nav>

  <main>
    <section class="content">
      <!-- TODO: swap in your own quote -->
      <p class="quote">in deep water,<br>nothing is ever in a hurry.</p>

      <!-- TODO: edit these lines to say what you actually do -->
      <p class="intro">
        <span class="hello">hi, I'm cauwfe.</span><br>
        I make things for the internet.<br>
        Always learning, usually breaking something first.
      </p>

      <!-- Check these two links point at the right profiles -->
      <p class="links">
        <a href="https://github.com/cauwfe" target="_blank" rel="noopener">github</a>
        <span class="sep">/</span>
        <a href="https://x.com/cauwfe" target="_blank" rel="noopener">x</a>
      </p>
    </section>
  </main>

  <noscript>
    <style>#pond { display: none; }</style>
  </noscript>
  <script src="script.js"></script>
</body>
</html>
